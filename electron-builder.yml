appId: com.musiclibrary.desktop
productName: Music Library
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: sql
    to: sql
  - from: resources/bin
    to: bin
win:
  target:
    - nsis
asarUnpack:
  - "**/*.node"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
